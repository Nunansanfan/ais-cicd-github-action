# E14 — what masking does, and what it does not do.
# Use an invented value. Never a real credential.
name: E14 Secrets

on: workflow_dispatch

jobs:
  masking:
    runs-on: ubuntu-latest
    steps:
      - name: Print it directly
        run: echo "token = ${{ secrets.DEMO_TOKEN }}"

      - name: Print it through an environment variable
        run: echo "token = $TOKEN"
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}

      - name: Encode it, and masking is gone
        run: echo -n "$TOKEN" | base64
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}

      - name: Reverse it, and masking is gone
        run: echo "$TOKEN" | rev
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}

      - name: A secret that was never set is empty, not an error
        run: |
          echo "absent = '${{ secrets.NOT_SET }}'"
          test -z "${{ secrets.NOT_SET }}" && echo "empty string, and the step still passes"
