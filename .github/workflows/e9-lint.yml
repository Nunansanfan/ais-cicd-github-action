# E9 — running a real tool, and what it finds in a Databricks repository.
name: E9 Lint
on: [push, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the Python
        run: |
          pip install --quiet ruff==0.6.9
          ruff check --output-format=concise src tests
